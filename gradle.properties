# Gradle runtime options
org.gradle.daemon = true
org.gradle.jvmargs = -Xmx2G
org.gradle.parallel = true
org.gradle.caching = true

# Where deployPlugin copies the built jar. Better set per machine in ~/.gradle/gradle.properties
# or on the command line: -PhytaleModsDir="C:\Users\you\AppData\Roaming\Hytale\UserData\Mods"
# hytaleModsDir =

# Java version for every module (Hytale server 0.7.x is built for Java 25).
java_version = 25
