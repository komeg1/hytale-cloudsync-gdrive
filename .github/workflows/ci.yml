name: Tests

on:
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "master", "dev" ]

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The platforms players use: Windows, macOS and Linux (Steam Deck).
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Compiles every module (the plugin against the Hytale server API from maven.hytale.com)
      # and runs all tests. No Google credentials here: the jar is built without sign-in support.
      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            sync-core/build/reports/tests/
            gdrive/build/reports/tests/
