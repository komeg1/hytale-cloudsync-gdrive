name: Release

# Push a version tag on master to publish:  git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: [ "v*.*.*" ]

permissions:
  contents: write

jobs:
  github-release:
    name: Build and publish GitHub release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check the tag is on master
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag $GITHUB_REF_NAME is not on master. Merge to master first, then tag."
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # The OAuth client ids end up inside the released jar (Google treats installed-app client
      # secrets as public); they are kept out of the repository, not out of the jar.
      - name: Write secrets.properties
        env:
          TV_ID: ${{ secrets.GOOGLE_TV_CLIENT_ID }}
          TV_SECRET: ${{ secrets.GOOGLE_TV_CLIENT_SECRET }}
          DESKTOP_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          DESKTOP_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          if [ -z "$TV_ID" ] || [ -z "$TV_SECRET" ]; then
            echo "::error::Add the GOOGLE_TV_CLIENT_ID and GOOGLE_TV_CLIENT_SECRET repository secrets."
            exit 1
          fi
          {
            echo "google.tv.client_id=$TV_ID"
            echo "google.tv.client_secret=$TV_SECRET"
            echo "google.desktop.client_id=$DESKTOP_ID"
            echo "google.desktop.client_secret=$DESKTOP_SECRET"
          } > secrets.properties

      - name: Build and test
        run: ./gradlew build -Pversion=${{ steps.version.outputs.version }} --console=plain

      - name: Check the jar contains sign-in credentials
        run: |
          JAR="plugin/build/libs/CloudSaveSync-${{ steps.version.outputs.version }}.jar"
          unzip -l "$JAR" | grep -q cloudsavesync/google-oauth.properties

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "plugin/build/libs/CloudSaveSync-${{ steps.version.outputs.version }}.jar" \
            --title "Cloud Save Sync ${{ steps.version.outputs.version }}" \
            --generate-notes

      - name: Keep the jar for the CurseForge job
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: plugin/build/libs/CloudSaveSync-${{ steps.version.outputs.version }}.jar

  # Off until the CURSEFORGE_PROJECT_ID repository variable is set (Settings > Secrets and
  # variables > Actions > Variables), together with the CURSEFORGE_TOKEN secret.
  curseforge:
    name: Upload to CurseForge
    needs: github-release
    if: ${{ vars.CURSEFORGE_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plugin-jar

      - name: Upload file
        env:
          TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          PROJECT: ${{ vars.CURSEFORGE_PROJECT_ID }}
          # Comma-separated CurseForge game version ids, e.g. "12345". List them with:
          # curl -H "X-Api-Token: <token>" https://hytale.curseforge.com/api/game/versions
          GAME_VERSIONS: ${{ vars.CURSEFORGE_GAME_VERSIONS }}
          VERSION: ${{ needs.github-release.outputs.version }}
        run: |
          versions=$(echo "${GAME_VERSIONS:-}" | jq -R 'split(",") | map(select(length > 0) | tonumber)')
          metadata=$(jq -n --arg log "Release $VERSION. See https://github.com/${{ github.repository }}/releases/tag/v$VERSION" \
            --argjson versions "$versions" \
            '{changelog: $log, changelogType: "markdown", releaseType: "release", gameVersions: $versions}')
          curl --fail-with-body -sS \
            -H "X-Api-Token: $TOKEN" \
            -F "metadata=$metadata" \
            -F "file=@CloudSaveSync-$VERSION.jar" \
            "https://hytale.curseforge.com/api/projects/$PROJECT/upload-file"
